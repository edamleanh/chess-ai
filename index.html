<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs AI</title>
    
    <!-- Chess libraries -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        #board {
            margin: 0 auto;
            max-width: 500px;
        }
        
        .info-panel {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-label {
            font-weight: bold;
            color: #333;
        }
        
        .status-value {
            padding: 5px 15px;
            background: white;
            border-radius: 20px;
            border: 2px solid #667eea;
            color: #667eea;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #e0e7ff;
            color: #667eea;
        }
        
        .btn-secondary:hover {
            background: #c7d2fe;
        }
        
        .btn-danger {
            background: #fee;
            color: #dc2626;
        }
        
        .btn-danger:hover {
            background: #fcc;
        }
        
        #moveHistory {
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .thinking {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            margin-top: 10px;
            color: #856404;
            font-weight: bold;
        }
        
        .thinking.active {
            display: flex;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #ffc107;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .difficulty {
            margin-top: 15px;
        }
        
        .difficulty label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .difficulty select {
            width: 100%;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 24px;
                margin-bottom: 8px;
            }
            
            .subtitle {
                font-size: 12px;
                margin-bottom: 15px;
            }
            
            #board {
                max-width: 100%;
            }
            
            .info-panel {
                padding: 15px;
                margin-top: 15px;
            }
            
            .status {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .status-item {
                width: 100%;
                justify-content: space-between;
            }
            
            .status-value {
                padding: 4px 12px;
                font-size: 13px;
            }
            
            .controls {
                flex-direction: column;
                gap: 8px;
            }
            
            button {
                width: 100%;
                padding: 10px 20px;
                font-size: 13px;
            }
            
            .difficulty {
                margin-top: 12px;
            }
            
            .difficulty label {
                font-size: 13px;
                margin-bottom: 6px;
            }
            
            .difficulty select {
                padding: 8px;
                font-size: 13px;
            }
            
            #moveHistory {
                max-height: 120px;
                font-size: 12px;
                padding: 8px;
            }
            
            .thinking {
                padding: 8px;
                font-size: 13px;
            }
            
            .spinner {
                width: 16px;
                height: 16px;
            }
            
            .game-over-content {
                padding: 30px 20px;
                margin: 0 15px;
            }
            
            .game-over-content h2 {
                font-size: 22px;
                margin-bottom: 15px;
            }
            
            .game-over-content p {
                font-size: 14px;
                margin-bottom: 20px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 11px;
            }
            
            .container {
                padding: 15px;
            }
            
            button {
                padding: 8px 15px;
                font-size: 12px;
            }
        }
        
        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .game-over.active {
            display: flex;
        }
        
        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
        
        .game-over-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .game-over-content p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        /* Highlight cho ô cờ - Chess.com style */
        .highlight-square {
            background-color: rgba(255, 255, 0, 0.4) !important;
            box-shadow: inset 0 0 0 3px rgba(255, 215, 0, 0.8) !important;
            animation: glow-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes glow-pulse {
            0%, 100% {
                box-shadow: inset 0 0 0 3px rgba(255, 215, 0, 0.8) !important;
            }
            50% {
                box-shadow: inset 0 0 0 3px rgba(255, 215, 0, 0.3) !important;
            }
        }
        
        .highlight-move {
            background: radial-gradient(circle, rgba(0, 0, 0, 0.1) 25%, transparent 26%) !important;
            background-size: 100% 100% !important;
        }
        
        .highlight-capture {
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.15) 65%, transparent 66%),
                        radial-gradient(circle, rgba(0, 0, 0, 0.1) 25%, transparent 26%) !important;
            background-size: 100% 100% !important;
        }
        
        /* Màu bàn cờ giống Chess.com */
        .white-1e1d7 {
            background-color: #eeeed2 !important;
            color: #769656 !important;
        }
        
        .black-3c85d {
            background-color: #769656 !important;
            color: #eeeed2 !important;
        }
        
        /* Modal chọn màu quân */
        .color-selection-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .color-selection-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
        }
        
        .color-selection-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .color-selection-content p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .color-options {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .color-option {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f8f9fa;
        }
        
        .color-option:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .color-option svg {
            width: 60px;
            height: 60px;
        }
        
        .color-option span {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Modal chọn màu quân -->
    <div id="colorSelectionModal" class="color-selection-modal">
        <div class="color-selection-content">
            <h2>🎯 Chọn màu quân của bạn</h2>
            <p>Bạn muốn chơi quân trắng hay quân đen?</p>
            <div class="color-options">
                <div class="color-option" onclick="selectColor('white')">
                    <svg viewBox="0 0 45 45">
                        <g fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 22.5,11.63 L 22.5,6" stroke-linejoin="miter"/>
                            <path d="M 20,8 L 25,8" stroke-linecap="butt"/>
                            <path d="M 22.5,25 C 22.5,25 27,17.5 25.5,14.5 C 25.5,14.5 24.5,12 22.5,12 C 20.5,12 19.5,14.5 19.5,14.5 C 18,17.5 22.5,25 22.5,25" stroke-linecap="butt" stroke-linejoin="miter"/>
                            <path d="M 12.5,37 C 18,40.5 27,40.5 32.5,37 L 32.5,30 C 32.5,30 41.5,25.5 38.5,19.5 C 34.5,13 25,16 22.5,23.5 L 22.5,27 L 22.5,23.5 C 20,16 10.5,13 6.5,19.5 C 3.5,25.5 12.5,30 12.5,30 L 12.5,37" stroke-linecap="butt"/>
                            <path d="M 12.5,30 C 18,27 27,27 32.5,30" fill="none"/>
                            <path d="M 12.5,33.5 C 18,30.5 27,30.5 32.5,33.5" fill="none"/>
                            <path d="M 12.5,37 C 18,34 27,34 32.5,37" fill="none"/>
                        </g>
                    </svg>
                    <span>Quân Trắng</span>
                </div>
                <div class="color-option" onclick="selectColor('black')">
                    <svg viewBox="0 0 45 45">
                        <g fill="#000" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M 22.5,11.63 L 22.5,6" stroke-linejoin="miter"/>
                            <path d="M 20,8 L 25,8" stroke-linecap="butt"/>
                            <path d="M 22.5,25 C 22.5,25 27,17.5 25.5,14.5 C 25.5,14.5 24.5,12 22.5,12 C 20.5,12 19.5,14.5 19.5,14.5 C 18,17.5 22.5,25 22.5,25" stroke-linecap="butt" stroke-linejoin="miter"/>
                            <path d="M 12.5,37 C 18,40.5 27,40.5 32.5,37 L 32.5,30 C 32.5,30 41.5,25.5 38.5,19.5 C 34.5,13 25,16 22.5,23.5 L 22.5,27 L 22.5,23.5 C 20,16 10.5,13 6.5,19.5 C 3.5,25.5 12.5,30 12.5,30 L 12.5,37" stroke-linecap="butt"/>
                            <path d="M 12.5,30 C 18,27 27,27 32.5,30" fill="none"/>
                            <path d="M 12.5,33.5 C 18,30.5 27,30.5 32.5,33.5" fill="none"/>
                            <path d="M 12.5,37 C 18,34 27,34 32.5,37" fill="none"/>
                        </g>
                    </svg>
                    <span>Quân Đen</span>
                </div>
                <div class="color-option" onclick="selectColor('random')">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="40" fill="#667eea"/>
                        <text x="50" y="65" font-size="50" text-anchor="middle" fill="white">?</text>
                    </svg>
                    <span>Ngẫu nhiên</span>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <h1>♟️ Chess vs AI</h1>
        <p class="subtitle">Bạn chơi quân Trắng - AI chơi quân Đen</p>
        
        <div id="board"></div>
        
        <div class="info-panel">
            <div class="status">
                <div class="status-item">
                    <span class="status-label">Lượt:</span>
                    <span class="status-value" id="turn">Trắng</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Trạng thái:</span>
                    <span class="status-value" id="status">Đang chơi</span>
                </div>
            </div>
            
            <div class="thinking" id="thinking">
                <div class="spinner"></div>
                <span>Stockfish đang suy nghĩ...</span>
            </div>
            
            <div class="difficulty">
                <label for="difficultySelect">🎯 Độ khó:</label>
                <select id="difficultySelect">
                    <option value="5">Dễ (Depth 5)</option>
                    <option value="8" selected>Trung bình (Depth 8)</option>
                    <option value="12">Khó (Depth 12)</option>
                    <option value="16">Rất khó (Depth 16)</option>
                </select>
            </div>
            
            <div class="difficulty">
                <label for="timeSelect">⏱️ Thời gian suy nghĩ:</label>
                <select id="timeSelect">
                    <option value="500">Nhanh (0.5s)</option>
                    <option value="1000" selected>Trung bình (1s)</option>
                    <option value="2000">Chậm (2s)</option>
                    <option value="5000">Rất chậm (5s)</option>
                    <option value="0">Không giới hạn</option>
                </select>
            </div>
            
            <div class="controls">
                <button class="btn-primary" onclick="newGame()">🔄 Ván mới</button>
                <button class="btn-secondary" onclick="undoMove()">↶ Hoàn tác</button>
                <button class="btn-danger" onclick="flipBoard()">🔃 Lật bàn cờ</button>
            </div>
            
            <div id="moveHistory"></div>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p id="gameOverMessage">Trò chơi đã kết thúc</p>
            <button class="btn-primary" onclick="newGame()">Chơi lại</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
